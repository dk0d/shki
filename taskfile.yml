version: 3

tasks:
  default:
    cmd: task --list-all

  up:
    cmd: docker compose -p shki up -d

  down:
    cmd: docker compose -p shki down -v

  test:
    desc: Run unit tests
    cmds:
      - cargo nextest run {{ .CLI_ARGS }}

  tools:install:
    desc: Install dev tooling
    cmds:
      - cargo install cargo-binstall
      - cargo binstall cargo-nextest -y
      - cargo binstall bacon -y
      - cargo binstall cargo-dist -y
      - cargo binstall cargo-release -y
      - cargo binstall cargo-update -y
      - cargo binstall cargo-llvm-cov -y

  # https://nexte.st/docs/integrations/test-coverage/
  test:cov:
    desc: Run test coverage
    cmd: cargo llvm-cov nextest

  # https://nexte.st/docs/integrations/test-coverage/
  test:cov:html:
    desc: Run test coverage
    cmds:
      - cargo llvm-cov nextest --open

  docs:version:
    desc: Archive the current docs as a release version (VERSION=X.Y.Z); the release flow runs this at bump time
    dir: docs-site
    cmds:
      - bun scripts/add-version.mjs {{.VERSION}}
      - bun install --frozen-lockfile
      - bun run build
    requires:
      vars:
        - VERSION

  docs:archive-tag:
    desc: Archive a released tag's docs as a docs version (TAG=vX.Y.Z); for backfilling historical releases
    dir: docs-site
    cmds:
      - chmod +x scripts/archive-tag.sh && scripts/archive-tag.sh {{.TAG}}
    requires:
      vars:
        - TAG

  cargo-release:
    internal: true
    desc: Prepare a release commit; merge its PR with the `release` label to tag and publish
    cmds:
      - branch="$(git branch --show-current)" && cargo release {{.BUMP}} --workspace --no-publish --no-tag --allow-branch "$branch" --execute
      # The root docs are "Next" (tracking main); releasing X.Y.Z archives the
      # release's own docs as version X.Y.Z and marks it as the latest release,
      # all folded into the release commit. Prereleases skip this entirely.
      # If this stage fails, the release commit exists WITHOUT the version's
      # docs snapshot — see "If the docs step of a release fails" in
      # docs-site/README.md for the recovery commands.
      - |
        version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "shki") | .version')"
        case "$version" in
          *-*) echo "prerelease ${version}: skipping docs archive"; exit 0 ;;
        esac
        task docs:version VERSION="$version"
        (cd docs-site && bun scripts/set-latest.mjs "$version")
        git add docs-site
        git commit --amend --no-edit
    requires:
      vars:
        - BUMP

  major:
    desc: Prepare the next major cargo-release commit on the current branch
    cmds:
      - task: cargo-release
        vars:
          BUMP: major

  minor:
    desc: Prepare the next minor cargo-release commit on the current branch
    cmds:
      - task: cargo-release
        vars:
          BUMP: minor

  patch:
    desc: Prepare the next patch cargo-release commit on the current branch
    cmds:
      - task: cargo-release
        vars:
          BUMP: patch

  rc:
    desc: Prepare the next rc cargo-release commit on the current branch
    cmds:
      - task: cargo-release
        vars:
          BUMP: rc
