version: 3

tasks:
  default:
    cmd: task --list-all

  up:
    cmd: docker compose -p shki up -d

  down:
    cmd: docker compose -p shki down -v

  test:
    desc: Run unit tests
    cmds:
      - cargo nextest run {{ .CLI_ARGS }}

  tools:install:
    desc: Install dev tooling
    cmds:
      - cargo install cargo-binstall
      - cargo binstall cargo-nextest -y
      - cargo binstall bacon -y
      - cargo binstall cargo-dist -y
      - cargo binstall cargo-release -y
      - cargo binstall cargo-update -y
      - cargo binstall cargo-llvm-cov -y

  # https://nexte.st/docs/integrations/test-coverage/
  test:cov:
    desc: Run test coverage
    cmd: cargo llvm-cov nextest

  # https://nexte.st/docs/integrations/test-coverage/
  test:cov:html:
    desc: Run test coverage
    cmds:
      - cargo llvm-cov nextest --open

  docs:version:
    desc: Archive the current docs as a release version (VERSION=X.Y.Z); run during release prep and commit the result
    dir: docs-site
    cmds:
      - bun scripts/add-version.mjs {{.VERSION}}
      - bun install --frozen-lockfile
      - bun run build
    requires:
      vars:
        - VERSION

  cargo-release:
    internal: true
    desc: Prepare a release commit; merge its PR with the `release` label to tag and publish
    cmds:
      - branch="$(git branch --show-current)" && cargo release {{.BUMP}} --workspace --no-publish --no-tag --allow-branch "$branch" --execute
    requires:
      vars:
        - BUMP

  major:
    desc: Prepare the next major cargo-release commit on the current branch
    cmds:
      - task: cargo-release
        vars:
          BUMP: major

  minor:
    desc: Prepare the next minor cargo-release commit on the current branch
    cmds:
      - task: cargo-release
        vars:
          BUMP: minor

  patch:
    desc: Prepare the next patch cargo-release commit on the current branch
    cmds:
      - task: cargo-release
        vars:
          BUMP: patch

  rc:
    desc: Prepare the next rc cargo-release commit on the current branch
    cmds:
      - task: cargo-release
        vars:
          BUMP: rc
