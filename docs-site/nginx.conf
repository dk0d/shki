# Template: __LATEST__ is replaced at image build with the latest release slug
# from versions.json. The site root serves the latest release's archive; /next/
# is main; /<X.Y.Z>/ are archived releases. Root-built pages are pruned from
# the image, so anything not found on disk falls through to the latest archive.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Hashed build assets are immutable.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/index.html @latest;
    }

    # Serve the latest release's archive for root paths (terminal =404 avoids
    # re-entering this fallback).
    location @latest {
        try_files /__LATEST__$uri /__LATEST__$uri/index.html =404;
    }

    error_page 404 /404.html;
}
