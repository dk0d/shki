[package]
name = "shki"
version = "0.1.0"
edition = "2024"
description = "Declarative database schema management and migration tool for Rust"
license = "MIT"
repository = "https://github.com/dk0d/shki"
keywords = ["database", "schema", "migration", "postgresql", "mysql", "sqlite"]
categories = ["database", "command-line-utilities"]

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.54", features = ["derive", "string", "env"] }
colored = "3.1.1"
figment = { version = "0.10.19", features = ["env", "toml", "serde_json"] }
indexmap = { version = "2.13.0", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sqlx = { version = "0.8.6", features = ["runtime-tokio"] }
thiserror = "2.0.18"
tokio = { version = "1.49.0", features = ["full"] }
toml = "0.9.11"
