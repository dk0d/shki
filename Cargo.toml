[package]
name = "shki"
version = "0.1.0"
edition = "2024"
description = "Declarative database schema management and migration tool in Rust"
license = "MIT"
repository = "https://github.com/dk0d/shki"
keywords = ["database", "schema", "migration", "postgresql", "mysql", "sqlite"]
categories = ["database", "command-line-utilities"]

[[bin]]
name = "shki"
path = "src/main.rs"

[lib]
name = "shki"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0.100"
chrono = { version = "0.4.43", features = ["serde"] }
clap = { version = "4.5.54", features = ["derive", "string", "env"] }
colored = "3.1.1"
figment = { version = "0.10.19", features = ["env", "toml", "serde_json"] }
indexmap = { version = "2.13.0", features = ["serde"] }
thiserror = "2.0.18"

# Serialization and Deserialization
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
toml = "0.9.11"

# Database Drivers
sqlx = { version = "0.8.6", features = ["runtime-tokio"] }
tokio = { version = "1.49.0", features = ["full"] }
uuid = { version = "1.20.0", features = ["v4", "v7", "serde"] }
mlua = { version = "0.11.5", features = [
  "lua54",
  "anyhow",
  "serde",
  "vendored",
] }

[dev-dependencies]
tempfile = "3.24.0"
