name: Tag Release

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

permissions:
  contents: read

jobs:
  tag:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: release
        name: Detect merged release PR
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          pr_number="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${SHA}/pulls" --jq '.[0].number // empty' 2>/dev/null || true)"
          if [[ -n "$pr_number" ]]; then
            labels="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${pr_number}/labels" --jq '.[].name')"
            grep -Fxq release <<< "$labels" || exit 0
            version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "shki") | .version')"
            echo "tag=v${version}" >> "$GITHUB_OUTPUT"
            echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          else
            # Direct push to main (admins only, enforced by branch protection):
            # tag the newest release commit since the last release tag, at that commit,
            # with the version taken from its subject line.
            last_tag="$(git describe --tags --abbrev=0 --match 'v*' "$SHA" 2>/dev/null || true)"
            release="$(git log --format='%H %s' "${last_tag:+${last_tag}..}${SHA}" \
              | grep -E '^[0-9a-f]+ release: [0-9]+\.[0-9]+\.[0-9]+([-.+][A-Za-z0-9_.+-]+)?$' | head -1)"
            [[ -n "$release" ]] || exit 0
            echo "tag=v${release#* release: }" >> "$GITHUB_OUTPUT"
            echo "sha=${release%% *}" >> "$GITHUB_OUTPUT"
          fi
      - name: Create release tag
        if: steps.release.outputs.tag != ''
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
          SHA: ${{ steps.release.outputs.sha }}
        run: |
          if [[ -z "$RELEASE_TOKEN" ]]; then
            echo "RELEASE_TOKEN is required to push release tags and trigger cargo-dist" >&2
            exit 1
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            [[ "$(git rev-list -n1 "$TAG")" == "$SHA" ]] || {
              echo "${TAG} already points to another commit" >&2
              exit 1
            }
            exit 0
          fi
          git tag "$TAG" "$SHA"
          git push "https://x-access-token:${RELEASE_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "refs/tags/${TAG}"
      - name: Generate changelog
        if: steps.release.outputs.tag != ''
        id: changelog
        uses: orhun/git-cliff-action@v4
        with:
          args: --latest --strip all
        env:
          OUTPUT: ${{ runner.temp }}/changelog.md
      - name: Create draft release
        if: steps.release.outputs.tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
          SHA: ${{ steps.release.outputs.sha }}
          CHANGELOG: ${{ steps.changelog.outputs.changelog }}
        run: |
          # create-release = false in dist-workspace.toml: the Release workflow expects
          # this draft to exist, uploads artifacts to it, and undrafts it.
          # Notes: git-cliff changelog section + dist's install/download body.
          gh release view "$TAG" >/dev/null 2>&1 && exit 0
          dist_version="$(grep cargo-dist-version dist-workspace.toml | grep -Eo '[0-9]+\.[0-9]+\.[0-9]+')"
          curl --proto '=https' --tlsv1.2 -LsSf "https://github.com/axodotdev/cargo-dist/releases/download/v${dist_version}/cargo-dist-installer.sh" | sh
          git checkout -q "$SHA"
          {
            cat "$CHANGELOG"
            echo
            ~/.cargo/bin/dist plan --tag="$TAG" --output-format=json | jq -r '.announcement_github_body'
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" --draft --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
