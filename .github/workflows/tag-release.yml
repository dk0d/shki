name: Tag Release

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

permissions:
  actions: write
  contents: write

jobs:
  tag:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: release
        name: Detect release commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          subject="$(git log -1 --format=%s)"
          pr_title="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${SHA}/pulls" --jq '.[0].title // empty' 2>/dev/null || true)"
          for candidate in "$subject" "$pr_title"; do
            if [[ "$candidate" =~ ^release:\ ([0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.+-]+)?)$ ]]; then
              echo "tag=v${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
      - name: Create release tag
        if: steps.release.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          existing="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" --jq .object.sha 2>/dev/null || true)"
          if [[ -n "$existing" && "$existing" != "$SHA" ]]; then
            echo "${TAG} already points to ${existing}, not ${SHA}" >&2
            exit 1
          fi
          if [[ -z "$existing" ]]; then
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/tags/${TAG}" -f sha="$SHA"
          fi
          gh workflow run Release --ref "$TAG"
