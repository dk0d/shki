name: Docs Deploy

# Deploy the docs site to Dokploy on release tags only (created by
# tag-release.yml). The webhook triggers the Dokploy application to pull main
# and rebuild docs-site/Dockerfile; by the time a release tag exists, main
# carries that release's docs (including the archived version snapshot from the
# release PR).
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-22.04
    steps:
      - name: Trigger Dokploy deployment
        env:
          WEBHOOK_URL: ${{ secrets.DOKPLOY_DOCS_WEBHOOK_URL }}
        run: |
          if [[ -z "$WEBHOOK_URL" ]]; then
            echo "DOKPLOY_DOCS_WEBHOOK_URL secret is not configured" >&2
            exit 1
          fi
          curl --fail-with-body -sS -X POST "$WEBHOOK_URL"
