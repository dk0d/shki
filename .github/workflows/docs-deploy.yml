name: Docs Deploy

# Manual out-of-band docs redeploy. Normal deploys are Dokploy's auto-deploy
# on pushes to main (the root docs are "Next", tracking main; release commits
# carry their version archive, so a release merge deploys everything at once).
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-22.04
    steps:
      - name: Trigger Dokploy deployment
        env:
          WEBHOOK_URL: ${{ secrets.DOCS_DEPLOY_HOOK_URL }}
        run: |
          if [[ -z "$WEBHOOK_URL" ]]; then
            echo "DOCS_DEPLOY_HOOK_URL secret is not configured" >&2
            exit 1
          fi
          curl --fail-with-body -sS -X POST "$WEBHOOK_URL"
